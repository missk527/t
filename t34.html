{title:"Passage 1 — The Flags of Gull Point",text:`For nearly a century, the signal hut at Gull Point had sent messages to ships using coloured flags. Radio made the hut unnecessary, and it became a tiny museum overlooking the harbour. When twelve-year-old Nia volunteered there, curator Mr Bell expected her to dust display cases. Instead, she asked why the flagpole was bare.

Mr Bell explained that the old cotton flags were too fragile for the wind. Nia proposed making replicas, but the museum owned no sewing machine. She studied photographs and noticed that the original flags were assembled from simple rectangles and triangles. With permission, she recruited the harbour craft club, whose members stitched heavy marine cloth by hand.

The first replica looked splendid indoors. Outside, however, it wrapped itself around the pole. Retired sailor Mrs Venn showed Nia a narrow wooden bar called a toggle. Fastened along the flag's top edge, it held the cloth open when the wind weakened.

Nia planned a demonstration for the summer fair. Visitors would decode three signals: WEATHER WORSENING, DOCTOR NEEDED and WELCOME HOME. She placed explanation cards beside the hut, but a gust carried two over the cliff rail. Rather than print heavier cards, Nia painted the code on flat stones. Their rough surfaces made the letters imperfect, yet they stayed put.

On fair morning, fog swallowed the harbour. The flags could barely be seen from the pier. Mr Bell suggested cancelling, but Nia moved the audience uphill, behind the hut. Against the pale fog, the flags appeared as sharp blocks of colour.

Halfway through, a visiting child arranged two flags incorrectly. They signalled KEEP CLEAR instead of WELCOME HOME. Nia did not correct him at once. She asked the crowd what the unexpected message meant and why accuracy mattered at sea.

By afternoon the fog lifted. A fishing boat entered the harbour, and its crew answered Nia's final signal with three blasts of its horn. The replica flags had not revived an obsolete system; they had made its logic visible. Mr Bell gave Nia a new museum job: not polishing history, but helping people read it.`,questions:[

{title:"Passage 2 — The Clockwork Seed Library",text:`The library in Alder Square lent more than books. In a tall cabinet beside the history shelves, it kept envelopes of bean, herb and flower seeds. Borrowers planted them, then returned seeds from the strongest plants after harvest.

One spring, librarian Mr Adey found that people were taking the newest packets while older seeds remained untouched. Since seeds gradually lose their ability to sprout, this threatened to waste much of the collection. Thirteen-year-old Tomas suggested copying the rotating shelves used in the bakery where his mother worked: older loaves always moved to the front.

Together they built a circular wooden rack. Turning a brass handle moved each seed drawer one position forward. A painted arrow marked the drawer to be borrowed next. Tomas called it the seed clock, although it measured no hours.

During testing, the rack jammed every seventh turn. Tomas blamed a crooked drawer, but Mr Adey placed a chalk dot on one gear tooth and turned the handle slowly. The jam always occurred when the marked tooth met a smaller wheel. A splinter was lodged between them. Removing it fixed the mechanism.

The machine created a different problem. Visitors treated the arrow as a command and took seeds unsuitable for their gardens. Balcony growers chose climbing beans they had nowhere to support. Tomas added coloured labels: blue for pots, green for shady ground and yellow for sunny beds. The arrow now indicated age; the labels indicated suitability.

At the launch, six-year-old Leni asked what happened if nobody wanted the oldest seeds. Tomas expected Mr Adey to answer. Instead, the librarian handed Leni a small tray. Unwanted seeds, he explained, would be tested on damp cloth. If enough sprouted, they would be offered again. If not, the packet would be replaced and its remaining seeds added to the compost.

By autumn, returns filled the cabinet. Some envelopes held fewer seeds than had been borrowed, but Mr Adey did not mind. The library was not a bank demanding interest. Its success was measured in healthy plants and shared knowledge.

Tomas engraved one sentence around the seed clock's handle: “Take the past forward, one turn at a time.”`,questions:[
["What did the special cabinet contain?",["Rare books","Seed envelopes","Clock parts","Baking tools"],1],["What were borrowers asked to return?",["Whole plants","Seeds from strong plants","Empty pots","Library cards"],1],["Which packets were being ignored?",["Newest","Older","Flower","Bean"],1],["Why was that wasteful?",["Seeds lose viability over time","Drawers became heavy","New seeds cost less","Plants grew too quickly"],0],["What inspired Tomas's solution?",["A museum display","Rotating bakery shelves","A railway signal","A garden clock"],1],["What did the bakery system move forward?",["Older loaves","Fresh flour","Metal trays","Recipe cards"],0],["What moved the seed drawers?",["A brass handle","An electric motor","A rope","A water wheel"],0],["Why was it called a seed clock?",["It chimed hourly","It rotated in order despite measuring no time","It predicted harvest","It had twelve drawers"],1],["How often did the rack jam?",["Every second turn","Every seventh turn","Once a day","Only at launch"],1],["How did Mr Adey locate the fault?",["He replaced every drawer","He marked a gear tooth with chalk","He listened from outside","He oiled the handle"],1],["What caused the jam?",["A splinter between gears","A crooked arrow","Wet seeds","A missing drawer"],0],["What mistake did visitors make?",["They ignored the arrow","They chose unsuitable seeds","They returned books","They broke the labels"],1],["Why were climbing beans poor for some balconies?",["They needed support","They disliked sunlight","They grew underground","They attracted birds"],0],["What did blue labels mean?",["Sunny beds","Suitable for pots","Shady ground","Old seeds"],1],["What did the arrow indicate after labels were added?",["Seed age","Plant colour","Water needs","Packet price"],0],["How were unwanted old seeds tested?",["In an oven","On damp cloth","In deep soil","Under ice"],1],["What happened if too few sprouted?",["The packet was replaced","They were sold","The rack stopped","Borrowers paid"],0],["Why did fewer returned seeds not worry Mr Adey?",["The library valued plants and knowledge over exact repayment","He never counted","Seeds were worthless","Tomas replaced them all"],0],["What does the engraved sentence suggest?",["Older resources should be used thoughtfully","Time should stop","Only new seeds matter","Gardening is a race"],0],["Which is the best summary?",["A rotating system helps a seed library reduce waste while guiding borrowers","A bakery begins lending books","A broken clock ruins a harvest","Visitors replace every seed with compost"],0]]},
{title:"Passage 3 — Lanterns in the Tide",text:`At low tide, the rocks below Northhaven looked black and ordinary. After sunset, marine biologist Dr Ko touched a pool with the tip of a paddle. Blue sparks swirled around it. The light came from microscopic plankton that flashed when the water moved.

Dr Ko's youth survey team had come to map where the glowing plankton gathered. Fourteen-year-old Elsie carried a waterproof grid map, while her partner Rafi held a meter that measured water temperature. They agreed to use only dim red torches because bright white light would spoil their night vision and make the glow harder to judge.

Their first pool shone brilliantly. Elsie marked it with the highest score, five. Rafi noticed that their boots had stirred the water before the observation. They waited until the pool became still, then disturbed it once with the paddle as required by the survey rules. The new score was only three. Elsie crossed out her first result rather than hiding the mistake.

Farther along the shore, they found two equally bright pools. One was warm and shallow; the other was cold and deep. This weakened Dr Ko's guess that warmer water alone produced stronger light. Elsie suggested that trapped seaweed might provide food for plankton. The team recorded the idea but did not call it a conclusion.

Near midnight, clouds covered the moon. The glow seemed suddenly brighter, although the plankton had not necessarily changed. Dr Ko stopped the survey. Scores made under a darker sky could not fairly be compared with earlier ones. While they waited, Rafi measured cloud cover by dividing the sky into eight imaginary sections.

When the moon returned, a wave filled several pools with fresh seawater. The team marked those sites with a star because their conditions had changed. They would not mix starred results with the original set.

The next week, Dr Ko displayed the map at the aquarium. The most useful marks were not the dramatic fives but the crossings-out, cloud notes and stars. They showed exactly where certainty ended.

Elsie had hoped the survey would explain the glowing tide. Instead, it taught her something more durable: careful observers do not merely collect wonders; they record the limits of what they know.`,questions:[
["What produced the blue sparks?",["Moonlight","Microscopic plankton","Fish scales","A hidden lamp"],1],["When were the rocks examined?",["At high tide at noon","At low tide after sunset","During sunrise","In a storm"],1],["What was the team's goal?",["To collect every plankton","To map where glowing plankton gathered","To photograph boats","To measure cliff height"],1],["What did Elsie carry?",["A waterproof grid map","A white lantern","A fishing net","A camera"],0],["What did Rafi measure?",["Wind speed","Water temperature","Rock age","Tide sound"],1],["Why were red torches used?",["To preserve night vision","To warm the pools","To attract fish","To signal boats"],0],["What was Elsie's first score?",["Two","Three","Five","Eight"],2],["Why was that score unreliable?",["Boots had already stirred the pool","The paddle broke","The map was wet","The water froze"],0],["What score followed the standard test?",["One","Three","Four","Five"],1],["What did Elsie do with the mistaken score?",["Hid it","Crossed it out","Changed the rules","Blamed Rafi"],1],["What challenged Dr Ko's temperature guess?",["Equally bright pools had different temperatures","All pools were cold","The meter failed","Clouds warmed the shore"],0],["What possible factor did Elsie suggest?",["Trapped seaweed","Red torchlight","Boot colour","Rock shape"],0],["Why was her idea not called a conclusion?",["It was only a possibility needing evidence","Dr Ko disliked seaweed","The survey had ended","Rafi disproved it"],0],["What happened when clouds covered the moon?",["The apparent glow brightened","The tide vanished","The pools dried","The plankton stopped"],0],["Why did Dr Ko pause the survey?",["Comparisons would be unfair under different darkness","Everyone was tired","The torches failed","A boat arrived"],0],["How did Rafi estimate cloud cover?",["Using eight imaginary sky sections","Counting stars","Measuring rainfall","Watching a clock"],0],["Why were some pools marked with stars?",["A wave changed their conditions","They had the best glow","They contained fish","They were deepest"],0],["Which marks proved most useful later?",["Only the highest scores","Corrections, cloud notes and stars","Decorative borders","Temperature totals alone"],1],["What did those marks reveal?",["Where certainty ended","Where tourists stood","How to make plankton","When the aquarium opened"],0],["What is the passage's central lesson?",["Good observation includes recording uncertainty and limits","Bright results are always best","Night surveys need white lights","One factor always explains nature"],0]]}

dossier("Passage 1 — The Whispering Bridge",`People crossing Alder Bridge heard a faint whistle on cold mornings. Some blamed gaps in the stones, while others said the river itself was singing.

Thirteen-year-old Caleb walked beneath the bridge with engineer Ms Durrant. He held light ribbons near drainage holes and found that only one pulled inward when the whistle sounded. The hole connected to a hollow iron handrail above.

Caleb built three short model rails with round, square and narrow openings. A fan produced sound from each, but the pitch changed whenever its speed changed. He added a simple wind meter so comparisons could be made at equal airflow.

The narrow opening produced the closest note. Yet the real bridge whistled only in winter. Ms Durrant discovered that an internal joint contracted in cold weather, creating a thin gap. On warmer days the metal expanded and closed it.

The gap was harmless, but the handrail needed protection from trapped moisture. Workers added a covered vent that let water escape without producing the strong whistle. A recording of the old sound was placed on the bridge information page.

Caleb had not merely silenced a curiosity. By tracing air, shape and temperature, he preserved its explanation while preventing a future repair problem.`,[

dossier("Passage 2 — The Midnight Seed Bank",`The city seed bank stored rare meadow seeds in a cool basement. One Monday, technician Dr Iqbal found that several packets had absorbed moisture over the weekend.

Fourteen-year-old Erin checked the temperature log. It stayed steady, but humidity rose sharply each night. A cleaner had recently begun leaving the corridor door open so the floor would dry faster.

Erin placed humidity cards inside empty sample envelopes at different shelves. The lowest shelf showed the greatest change, though it also stood nearest a damp stone wall. She repeated the test after moving identical boxes to equal distances from the wall.

The night rise still appeared near the doorway. A strip curtain reduced humid air entering while allowing trolleys through. Packets were also placed in sealed containers with reusable drying beads.

One old packet had no reliable moisture record. Rather than return it to storage, the team tested a small number of seeds on damp paper. Most germinated, so the packet was kept but marked for earlier use.

Erin learned that preservation is not the same as placing something on a shelf and forgetting it. A collection survives because people watch its environment, question unusual patterns and act before small changes become permanent losses.`,[

dossier("Passage 3 — The Painted Tide Marks",`Inside the harbour warehouse, coloured lines climbed one stone wall. Tradition said each marked a famous flood, but several lines had no date.

Historian Mrs Eze asked twelve-year-old Rowan to record their heights. He measured from the floor until he noticed the floor sloped toward a drain. They changed to a fixed metal bolt as their reference point.

Blue paint on the highest line looked old, yet magnification showed it covered a newer repair mortar. A photograph from 1968 contained no blue line, proving it was added later than residents believed.

Two lower marks matched documented storms. Another lined up with the top of a former loading platform, suggesting it was a construction guide rather than a water level. Rowan labelled each mark by evidence type instead of calling them all floods.

During a high tide, a temporary sensor showed that waves splashed far above the steady water level. This explained why even genuine marks might record brief spray rather than the full height of a flood.

The warehouse display kept every line, including the doubtful ones. Its new labels separated confirmed, possible and non-flood marks. Rowan saw that correcting a tradition need not erase it; careful labels could turn uncertainty itself into part of the history.`,[
